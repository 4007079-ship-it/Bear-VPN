name: e2e

# Сквозная проверка: локальные тестовые серверы + настоящее ядро Xray.
# Ключи одноразовые, создаются при каждом запуске.
on:
  push:
    branches: ["**"]
    paths: ["app/lib/**", "app/test/e2e_configs_test.dart", "packages/**", "tools/e2e/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - name: Проверка протоколов и настроек
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: e2e-logs
          retention-days: 7
