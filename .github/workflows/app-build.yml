name: app-build

# Тестовые сборки приложения: APK для Android и папка с .exe для Windows.
# Платформенные каталоги (android/, windows/) генерируются flutter create
# при сборке; когда понадобятся свои настройки манифестов — закоммитим их.

on:
  push:
    paths: ["app/**", "packages/**", ".github/workflows/app-build.yml"]
    # Только ветки: при одном фильтре по тегам GitHub перестаёт запускать
    # сборку для веток. Релизы собираются по событию release ниже.
    branches: ["**"]
  # Опубликованный релиз на GitHub — собрать и приложить файлы
  release:
    types: [published]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=android --org com.smv --project-name smv_vpn .
          sed -i 's/android:label="smv_vpn"/android:label="Bear VPN"/' android/app/src/main/AndroidManifest.xml
          cp -r branding/android/res/. android/app/src/main/res/
          # flutter_vless: minSdk 23 и распаковка нативных библиотек (xray, tun2socks)
          python3 - <<'PY'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = maxOf(23, flutter.minSdkVersion)')
          s = s.replace('android {', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }', 1)
          open(p, 'w').write(s)
          PY
          grep -n "minSdk\|useLegacyPackaging" android/app/build.gradle.kts
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --dart-define=APP_VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/Bear-VPN-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bear-VPN-android
          path: app/build/Bear-VPN-test.apk
          retention-days: 30

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        shell: pwsh
        run: |
          flutter create --platforms=windows --org com.smv --project-name smv_vpn .
          (Get-Content windows/runner/main.cpp) -replace 'L"smv_vpn"', 'L"Bear VPN"' | Set-Content windows/runner/main.cpp
          # Имя файла BearVPN.exe; в свойствах файла — Bear VPN, разработчик SMV
          (Get-Content windows/CMakeLists.txt) -replace 'set\(BINARY_NAME "smv_vpn"\)', 'set(BINARY_NAME "BearVPN")' | Set-Content windows/CMakeLists.txt
          $rc = Get-Content windows/runner/Runner.rc -Raw
          $rc = $rc.Replace('com.smv', 'SMV').Replace('smv_vpn.exe', 'BearVPN.exe').Replace('"smv_vpn"', '"Bear VPN"')
          Set-Content windows/runner/Runner.rc $rc -Encoding utf8
          Select-String -Path windows/CMakeLists.txt -Pattern BINARY_NAME | Select-Object -First 1
          Select-String -Path windows/runner/Runner.rc -Pattern 'VALUE "'
          Copy-Item branding/windows/app_icon.ico windows/runner/resources/app_icon.ico -Force
          # Размер окна как у Hiddify
          (Get-Content windows/runner/main.cpp) -replace 'Win32Window::Size size\(1280, 720\)', 'Win32Window::Size size(1060, 800)' | Set-Content windows/runner/main.cpp
          Select-String -Path windows/runner/main.cpp -Pattern 'Size size'
      - run: flutter pub get
      - name: Build Windows
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          flutter build windows --release --dart-define=APP_VERSION=$ver
      - name: Bundle Xray core (system proxy mode)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath build/windows/x64/runner/Release/xray -Force
          # Для режима VPN (TUN): tun2socks и драйвер wintun из примера плагина
          $base = 'https://github.com/XIIIFOX/flutter_vless/raw/main/example/windows/xray'
          foreach ($f in 'tun2socks.exe','wintun.dll') {
            Invoke-WebRequest "$base/$f" -OutFile "build/windows/x64/runner/Release/xray/$f"
          }
          Get-ChildItem build/windows/x64/runner/Release/xray
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          iscc /Q "/DAppVersion=$ver" "/DSourceDir=$src" installer/bear_vpn.iss
          Get-ChildItem build/installer
      - uses: actions/upload-artifact@v4
        with:
          name: Bear-VPN-windows-setup
          path: app/build/installer/*.exe
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Bear-VPN-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 30

  linux:
    # Старая Ubuntu — чтобы сборка запускалась и на системах постарше
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev imagemagick
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=linux --org com.smv --project-name smv_vpn .
          sed -i 's/set(BINARY_NAME "smv_vpn")/set(BINARY_NAME "bear-vpn")/' linux/CMakeLists.txt
          sed -i 's/"smv_vpn"/"Bear VPN"/g' linux/runner/my_application.cc
          sed -i 's/gtk_window_set_default_size(window, 1280, 720)/gtk_window_set_default_size(window, 1060, 800)/' linux/runner/my_application.cc
          grep -n "set_default_size" linux/runner/my_application.cc
          grep -n 'BINARY_NAME "' linux/CMakeLists.txt; grep -n '"Bear VPN"' linux/runner/my_application.cc
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=APP_VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
      - name: Bundle Xray core
        run: |
          B=build/linux/x64/release/bundle
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p $B/xray && unzip -qo xray.zip -d $B/xray xray geoip.dat geosite.dat
          chmod +x $B/xray/xray && $B/xray/xray version | head -1
      - name: Package (.tar.gz, .deb)
        run: installer/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bear-VPN-linux
          path: app/build/dist/*
          retention-days: 30

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --platforms=macos --org com.smv --project-name smv_vpn .
          sed -i '' 's/^PRODUCT_NAME = .*/PRODUCT_NAME = Bear VPN/' macos/Runner/Configs/AppInfo.xcconfig
          sed -i '' 's/^PRODUCT_COPYRIGHT = .*/PRODUCT_COPYRIGHT = © 2026 SMV/' macos/Runner/Configs/AppInfo.xcconfig
          # Без песочницы: ядру нужны локальные порты, а системному прокси — networksetup
          for f in macos/Runner/DebugProfile.entitlements macos/Runner/Release.entitlements; do
            /usr/libexec/PlistBuddy -c "Set :com.apple.security.app-sandbox false" "$f"
          done
          for s in 16 32 64 128 256 512 1024; do
            sips -z $s $s branding/bear_icon_1024.png \
              --out macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_$s.png >/dev/null
          done
          # flutter_vless требует macOS 13+
          sed -i '' "s/platform :osx, '[0-9.]*'/platform :osx, '13.0'/" macos/Podfile
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*;/MACOSX_DEPLOYMENT_TARGET = 13.0;/g' macos/Runner.xcodeproj/project.pbxproj
          # Размер окна как у Hiddify
          perl -0pi -e 's/(self\.setFrame\(windowFrame, display: true\))/$1\n    self.setContentSize(NSSize(width: 1060, height: 800))\n    self.center()/' macos/Runner/MainFlutterWindow.swift
          grep -n "setContentSize" macos/Runner/MainFlutterWindow.swift
          cat macos/Runner/Configs/AppInfo.xcconfig; grep -n "platform :osx" macos/Podfile
      - run: flutter pub get
      - name: Prepare flutter_vless (proxy-only)
        run: dart run flutter_vless:setup_macos_vpn --prepare-only
      - run: flutter build macos --release --dart-define=APP_VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
      - name: DMG
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([0-9.]+).*/\1/')
          APP="build/macos/Build/Products/Release/Bear VPN.app"
          ls "$APP/Contents/MacOS"; lipo -archs "$APP/Contents/MacOS/Bear VPN"
          mkdir -p dmg build/dist && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Bear VPN" -srcfolder dmg -ov -format UDZO "build/dist/Bear-VPN-${VER}-macos.dmg"
          ls -la build/dist
      - uses: actions/upload-artifact@v4
        with:
          name: Bear-VPN-macos
          path: app/build/dist/*.dmg
          retention-days: 30

  release:
    if: github.event_name == 'release'
    needs: [android, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp dist/Bear-VPN-android/Bear-VPN-test.apk "out/Bear-VPN-${VER}-android.apk"
          (cd dist/Bear-VPN-windows && zip -qr "../../out/Bear-VPN-${VER}-windows-x64.zip" .)
          cp dist/Bear-VPN-windows-setup/*.exe out/
          # Постоянные имена — для ссылок «последняя версия» в README:
          # https://github.com/<repo>/releases/latest/download/Bear-VPN-android.apk
          cp "out/Bear-VPN-${VER}-android.apk" out/Bear-VPN-android.apk
          cp "out/Bear-VPN-${VER}-windows-setup.exe" out/Bear-VPN-windows-setup.exe
          cp "out/Bear-VPN-${VER}-windows-x64.zip" out/Bear-VPN-windows-x64.zip
          cp dist/Bear-VPN-linux/* out/
          cp dist/Bear-VPN-macos/* out/
          cp "out/Bear-VPN-${VER}-linux-x64.tar.gz" out/Bear-VPN-linux-x64.tar.gz
          cp "out/Bear-VPN-${VER}-linux-amd64.deb" out/Bear-VPN-linux-amd64.deb
          cp "out/Bear-VPN-${VER}-macos.dmg" out/Bear-VPN-macos.dmg
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          name: Bear VPN ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          # Как отмечено при публикации: обычный релиз становится «Latest»
          prerelease: ${{ github.event.release.prerelease }}
          files: out/*
